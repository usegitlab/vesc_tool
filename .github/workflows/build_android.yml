name: Build VESC Tool Android (Chinese)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install NDK 23
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager \
            "ndk;23.2.8568313" "platforms;android-31" "build-tools;31.0.0" || true
          echo "ANDROID_SDK_ROOT=$SDK"                    >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/23.2.8568313"  >> $GITHUB_ENV

      - name: Install Qt 5.15.2 for Android (multi-arch)
        run: |
          pip install aqtinstall
          aqt install-qt linux android 5.15.2 android -O $HOME/Qt
          aqt install-qt linux desktop 5.15.2 gcc_64  -O $HOME/Qt
          echo "QT_ANDROID=$HOME/Qt/5.15.2/android" >> $GITHUB_ENV
          echo "QT_HOST=$HOME/Qt/5.15.2/gcc_64"     >> $GITHUB_ENV

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Show Qt structure
        run: |
          ls $HOME/Qt/5.15.2/
          ls $HOME/Qt/5.15.2/android/bin/ || true
          $HOME/Qt/5.15.2/android/bin/qmake --version || true
          echo "--- mkspecs check ---"
          ls $HOME/Qt/5.15.2/android/mkspecs/ | grep android || echo "No android mkspecs!"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

      - name: Build APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          mkdir -p build/android
          LOG=build/build.log
          {
            echo "=== ENV ==="
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "=== Qt android dirs ==="
            ls $HOME/Qt/5.15.2/ || true
            ls $HOME/Qt/5.15.2/android/ | head -10 || true
            echo "=== mkspecs ==="
            ls $HOME/Qt/5.15.2/android/mkspecs/ | grep android || echo "NO android mkspecs"
            echo "=== NDK ==="
            ls $ANDROID_NDK_ROOT | head -5 || echo "NDK NOT FOUND at $ANDROID_NDK_ROOT"
            echo "=== qmake ==="
            ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            $HOME/Qt/5.15.2/android/bin/qmake \
              "CONFIG += release_android build_mobile" \
              ANDROID_ABIS="arm64-v8a" \
              -spec $HOME/Qt/5.15.2/android/mkspecs/android-clang
            echo "=== make ==="
            make -j$(nproc)
            echo "=== make install ==="
            make install INSTALL_ROOT=build/android/build
            echo "=== androiddeployqt ==="
            $HOME/Qt/5.15.2/android/bin/androiddeployqt \
              --gradle \
              --no-gdbserver \
              --output build/android/build \
              --input android-vesc_tool-deployment-settings.json \
              --android-platform android-31
          } 2>&1 | tee $LOG
          cp build/android/build/build/outputs/apk/debug/build-debug.apk \
             vesc_tool_mobile_zh.apk
        continue-on-error: true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/build.log
          retention-days: 3

      - name: Upload APK (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesc_tool_mobile_chinese
          path: vesc_tool_mobile_zh.apk
          retention-days: 30
