name: Build VESC Tool Android (Chinese)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install NDK 23
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;23.2.8568313" "platforms;android-31" "build-tools;31.0.0" 2>/dev/null || true
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Diagnose and install Qt 5.15.2 for Android
        run: |
          pip install aqtinstall==3.1.9
          LOG=/tmp/aqt.log
          echo "=== aqtinstall version ===" | tee $LOG
          aqt --version 2>&1 | tee -a $LOG

          echo "=== Available android versions ===" | tee -a $LOG
          aqt list-qt linux android 2>&1 | tee -a $LOG || true

          echo "=== Archs for 5.15.2 ===" | tee -a $LOG
          aqt list-qt linux android 5.15.2 2>&1 | tee -a $LOG || true

          echo "=== Installing android arm64 ===" | tee -a $LOG
          aqt install-qt linux android 5.15.2 android_arm64_v8a -O $HOME/Qt 2>&1 | tee -a $LOG \
          || aqt install-qt linux android 5.15.2 android_arm64_v8a -O $HOME/Qt \
               --base https://mirrors.ocf.berkeley.edu/qt 2>&1 | tee -a $LOG \
          || aqt install-qt linux android 5.15.2 android_arm64_v8a -O $HOME/Qt \
               --base https://qt.mirror.constant.com 2>&1 | tee -a $LOG

          echo "=== Installing desktop gcc_64 ===" | tee -a $LOG
          aqt install-qt linux desktop 5.15.2 gcc_64 -O $HOME/Qt 2>&1 | tee -a $LOG \
          || aqt install-qt linux desktop 5.15.2 gcc_64 -O $HOME/Qt \
               --base https://mirrors.ocf.berkeley.edu/qt 2>&1 | tee -a $LOG
        continue-on-error: true

      - name: Upload Qt install log (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqt-install-log
          path: /tmp/aqt.log
          retention-days: 3

      - name: Check Qt was installed
        run: |
          test -f $HOME/Qt/5.15.2/android_arm64_v8a/bin/qmake || (echo "Qt NOT installed"; exit 1)
          echo "Qt OK: $($HOME/Qt/5.15.2/android_arm64_v8a/bin/qmake --version)"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Build APK
        run: |
          mkdir -p build/android
          $HOME/Qt/5.15.2/android_arm64_v8a/bin/qmake \
            "CONFIG += release_android build_mobile" \
            ANDROID_ABIS="arm64-v8a" \
            -spec android-clang
          make -j$(nproc)
          make install INSTALL_ROOT=build/android/build
          $HOME/Qt/5.15.2/gcc_64/bin/androiddeployqt \
            --gradle \
            --no-gdbserver \
            --output build/android/build \
            --input android-vesc_tool-deployment-settings.json \
            --android-platform android-31
          cp build/android/build/build/outputs/apk/debug/build-debug.apk \
             vesc_tool_mobile_zh.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_mobile_chinese
          path: vesc_tool_mobile_zh.apk
          retention-days: 30
