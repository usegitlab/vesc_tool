name: Build VESC Tool Android (Chinese)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: rabits/qt:5.15-android
      options: --user root

    steps:
      - name: Install git and fix permissions
        run: |
          apt-get update -y
          apt-get install -y git ca-certificates
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Show Qt/Android environment
        run: |
          qmake --version || true
          echo "SDK=$ANDROID_SDK_ROOT  NDK=$ANDROID_NDK_ROOT"

      - name: Build APK
        run: |
          mkdir -p build/android
          qmake "CONFIG += release_android build_mobile" \
            ANDROID_ABIS="arm64-v8a" \
            -spec android-clang
          make -j$(nproc)
          make install INSTALL_ROOT=build/android/build
          androiddeployqt \
            --gradle \
            --no-gdbserver \
            --output build/android/build \
            --input android-vesc_tool-deployment-settings.json \
            --android-platform android-29
          cp build/android/build/build/outputs/apk/debug/build-debug.apk \
             vesc_tool_mobile_zh.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_mobile_chinese
          path: vesc_tool_mobile_zh.apk
          retention-days: 30
