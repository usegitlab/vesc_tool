name: Build VESC Tool Android (Chinese)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install NDK 23
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;23.2.8568313" "platforms;android-31" "build-tools;31.0.0" 2>/dev/null || true
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Install aqtinstall (latest)
        run: pip install aqtinstall

      - name: Install Qt 5.15.2 desktop (gcc_64)
        run: aqt install-qt linux desktop 5.15.2 gcc_64 -O $HOME/Qt

      - name: Download Qt 5.15.2 Android arm64 from archive
        run: |
          sudo apt-get install -y p7zip-full
          BASE="https://download.qt.io/archive/qt/5.15/5.15.2/submodules"
          PKGS=(
            "qtbase-everywhere-src-5.15.2"
          )
          # Use the pre-built Android packages via aqt archive base
          aqt install-qt linux android 5.15.2 android_arm64_v8a \
            --base https://download.qt.io -O $HOME/Qt \
          || aqt install-qt linux android 5.15.2 android_arm64_v8a \
            --base https://mirrors.ocf.berkeley.edu/qt -O $HOME/Qt \
          || aqt install-qt linux android 5.15.2 android_arm64_v8a \
            --base https://ftp.fau.de/qtproject -O $HOME/Qt
          echo "QT_ANDROID=$HOME/Qt/5.15.2/android_arm64_v8a" >> $GITHUB_ENV

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Build APK
        run: |
          mkdir -p build/android
          $HOME/Qt/5.15.2/android_arm64_v8a/bin/qmake \
            "CONFIG += release_android build_mobile" \
            ANDROID_ABIS="arm64-v8a" \
            -spec android-clang
          make -j$(nproc)
          make install INSTALL_ROOT=build/android/build
          $HOME/Qt/5.15.2/gcc_64/bin/androiddeployqt \
            --gradle \
            --no-gdbserver \
            --output build/android/build \
            --input android-vesc_tool-deployment-settings.json \
            --android-platform android-31
          cp build/android/build/build/outputs/apk/debug/build-debug.apk \
             vesc_tool_mobile_zh.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_mobile_chinese
          path: vesc_tool_mobile_zh.apk
          retention-days: 30
